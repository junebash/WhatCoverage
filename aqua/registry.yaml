# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: junebash
    repo_name: WhatCoverage
    description: Changed-line coverage reporting for Swift projects
    version_constraint: semver(">= 0.9.0")
    asset: what-coverage-{{.Version}}-{{.OS}}-{{.Arch}}.{{.Format}}
    format: tar.gz
    replacements:
      amd64: x86_64
      darwin: macos
    files:
      - name: what-coverage
      - name: what-coverage-pr-comment
    checksum:
      type: github_release
      asset: SHA256SUMS
      algorithm: sha256
    supported_envs:
      - linux/amd64
      - darwin
