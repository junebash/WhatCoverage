name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
            container: null
            static-swift-stdlib: false
          - target: macos-x86_64
            runner: macos-15-intel
            container: null
            static-swift-stdlib: false
          - target: linux-x86_64
            runner: ubuntu-22.04
            # Swift 6.2.1 on Ubuntu 22.04 (glibc 2.35), pinned by manifest digest.
            container: swift:6.2.1-jammy@sha256:6e33c70a59180c9b518f67728538312975cb3891177d20215cd2e31bdfe70791
            static-swift-stdlib: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Swift 6.2 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          swift --version | grep -Eq 'Swift version 6\.2\.'
      - name: Install Linux binary inspection tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends binutils file
      - name: Build, package, and smoke-test executable
        run: >-
          .github/scripts/package-release-binary.sh
          "${{ matrix.target }}"
          "${{ matrix.static-swift-stdlib }}"
          dist/packages
      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/packages/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  linux-debian-smoke:
    name: Smoke test Linux archive on Debian 12
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/packages
      - name: Extract and run the exact archive on Debian 12
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD/dist/packages:/packages:ro" \
            debian:12-slim \
            bash -ec '
              apt-get update
              apt-get install --yes --no-install-recommends git
              cd /tmp
              sha256sum --check /packages/what-coverage-linux-x86_64.tar.gz.sha256
              tar -xzf /packages/what-coverage-linux-x86_64.tar.gz
              ./what-coverage --help >/dev/null
            '

  release:
    needs: linux-debian-smoke
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/packages
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify release baseline
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/tags/v0.0.0 || {
            echo "::error::Missing required bootstrap tag v0.0.0"
            exit 1
          }
          git merge-base --is-ancestor v0.0.0 HEAD || {
            echo "::error::v0.0.0 is not an ancestor of HEAD"
            exit 1
          }
          test "$(find dist/packages -maxdepth 1 -type f | wc -l)" -eq 6
      - run: npm ci
      - name: Create release and attach packages
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
