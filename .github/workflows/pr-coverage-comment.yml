name: PR Coverage Comment

on:
  workflow_run:
    workflows: [PR Coverage]
    types: [completed]

permissions: {}

concurrency:
  group: coverage-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      artifact-id: ${{ steps.context.outputs.artifact-id }}
      pr-number: ${{ steps.context.outputs.pr-number }}
      body: ${{ steps.render.outputs.body }}
    steps:
      - id: context
        name: Resolve pull request and report artifact
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const expected = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-coverage.yml',
            });
            if (run.workflow_id !== expected.data.id || run.path !== expected.data.path) {
              core.setFailed('The triggering workflow is not the expected PR Coverage workflow.');
              return;
            }

            const headRepositoryID = run.head_repository?.id;
            const matchesRun = (pr) => pr.head.sha === run.head_sha
              && pr.head.ref === run.head_branch
              && pr.head.repo?.id === headRepositoryID;
            let candidates = run.pull_requests || [];
            if (candidates.length === 0) {
              candidates = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
            }
            const matches = candidates.filter(matchesRun);
            if (matches.length !== 1) {
              core.setFailed(`Could not safely associate workflow run ${run.id} with one open pull request.`);
              return;
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const reports = artifacts.filter((artifact) => artifact.name === 'whatcoverage-report' && !artifact.expired);
            if (reports.length > 1) {
              core.setFailed(`Workflow run ${run.id} has multiple coverage report artifacts.`);
              return;
            }
            core.setOutput('pr-number', matches[0].number);
            core.setOutput('artifact-id', reports[0]?.id ?? '');
      - name: Check out the trusted comment renderer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build trusted comment renderer
        run: swift build --product what-coverage-pr-comment
      - name: Download report without executing it
        if: ${{ steps.context.outputs.artifact-id != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.context.outputs.artifact-id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/whatcoverage-report
          merge-multiple: true
      - name: Validate report and select bounded source requests
        id: source-request
        if: ${{ steps.context.outputs.artifact-id != '' }}
        continue-on-error: true
        env:
          REPORT_PATH: ${{ runner.temp }}/whatcoverage-report/what-coverage-report.json
          REQUEST_PATH: ${{ runner.temp }}/whatcoverage-source-request.json
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          .build/debug/what-coverage-pr-comment source-request \
            --report "$REPORT_PATH" \
            --head "$RUN_HEAD_SHA" \
            > "$REQUEST_PATH"
      - name: Fetch bounded source excerpts from the current PR head
        if: ${{ steps.source-request.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          REQUEST_PATH: ${{ runner.temp }}/whatcoverage-source-request.json
          SOURCES_PATH: ${{ runner.temp }}/whatcoverage-sources.json
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.context.outputs.pr-number }}
        with:
          script: |
            const fs = require('fs');
            try {
              const request = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'));
              if (!Array.isArray(request.paths)
                  || !Number.isSafeInteger(request.sourceFiles)
                  || !Number.isSafeInteger(request.sourceBytesPerFile)
                  || !Number.isSafeInteger(request.sourceBytesTotal)) throw new Error('invalid source request');
              const pr = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(process.env.PR_NUMBER) });
              const run = context.payload.workflow_run;
              if (pr.data.head.sha !== run.head_sha || pr.data.head.ref !== run.head_branch || pr.data.head.repo?.id !== run.head_repository?.id) throw new Error('PR head changed before source retrieval');
              const sources = {}; let bytes = 0;
              for (const sourcePath of request.paths) {
                if (Object.keys(sources).length >= request.sourceFiles) break;
                try {
                  const response = await github.rest.repos.getContent({ owner: pr.data.head.repo.owner.login, repo: pr.data.head.repo.name, path: sourcePath, ref: run.head_sha });
                  const item = response.data;
                  if (Array.isArray(item) || item.type !== 'file' || item.path !== sourcePath || item.encoding !== 'base64' || item.size > request.sourceBytesPerFile || typeof item.content !== 'string') continue;
                  const encoded = item.content.replace(/\s/g, '');
                  if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) continue;
                  const content = Buffer.from(encoded, 'base64');
                  if (content.length > request.sourceBytesPerFile || bytes + content.length > request.sourceBytesTotal || content.includes(0)) continue;
                  const text = new TextDecoder('utf-8', { fatal: true }).decode(content);
                  sources[sourcePath] = text; bytes += content.length;
                } catch (error) {
                  if (error.status === 403 || error.status === 429) break;
                  core.notice(`Source excerpt unavailable for ${sourcePath}`);
                }
              }
              fs.writeFileSync(process.env.SOURCES_PATH, JSON.stringify(sources), { mode: 0o600 });
            } catch (error) {
              core.warning(`Source excerpts unavailable: ${error.message}`);
              fs.writeFileSync(process.env.SOURCES_PATH, '{}', { mode: 0o600 });
            }
      - id: render
        name: Validate and render comment
        env:
          REPORT_PATH: ${{ runner.temp }}/whatcoverage-report/what-coverage-report.json
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCES_PATH: ${{ runner.temp }}/whatcoverage-sources.json
        run: |
          body=$(.build/debug/what-coverage-pr-comment render \
            --report "$REPORT_PATH" \
            --head "$RUN_HEAD_SHA" \
            --sources "$SOURCES_PATH" \
            --run-url "$RUN_URL")
          echo "body=$body" >> "$GITHUB_OUTPUT"
  comment:
    needs: prepare
    if: ${{ needs.prepare.outputs.pr-number != '' && needs.prepare.outputs.body != '' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create or update coverage comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
          COMMENT_BODY: ${{ needs.prepare.outputs.body }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_REPOSITORY_ID: ${{ github.event.workflow_run.head_repository.id }}
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pr.data.head.sha !== process.env.RUN_HEAD_SHA
                || pr.data.head.ref !== process.env.RUN_HEAD_BRANCH
                || String(pr.data.head.repo?.id) !== process.env.RUN_HEAD_REPOSITORY_ID) {
              core.notice('Skipping a stale coverage comment.');
              return;
            }
            const marker = '<!-- whatcoverage:pr-report:v1 -->';
            const body = Buffer.from(process.env.COMMENT_BODY, 'base64').toString('utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.data.number,
              per_page: 100,
            });
            const ours = comments.filter((comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (ours.length === 0) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.data.number, body });
              return;
            }
            await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: ours[0].id, body });
            for (const duplicate of ours.slice(1)) {
              await github.rest.issues.deleteComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: duplicate.id });
            }
